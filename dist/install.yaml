                    description: |-
                      Server admin password for server control and user management
                      If not provided, will use the repository password
                    type: string
                  serverAdminPasswordExistingSecret:
                    description: |-
                      Secret containing server admin password
                      Expected key: password
                      If provided, takes precedence over ServerAdminPassword
                    type: string
                  tls:
                    description: TLS configuration for the server
                    properties:
                      certificateCommonName:
                        description: |-
                          CertificateCommonName is the CN for the auto-generated certificate
                          Defaults to the service name
                        type: string
                      certificateDNSNames:
                        description: |-
                          CertificateDNSNames are additional DNS names for the auto-generated certificate
                          The service name is always included automatically
                        items:
                          type: string
                        type: array
                      secretName:
                        description: |-
                          Name of the secret containing TLS certificate and key
                          Secret should contain 'tls.crt' and 'tls.key' keys
                          If not provided, a self-signed certificate will be auto-generated
                        type: string
                    type: object
                required:
                - enabled
                type: object
              sftpOptions:
                description: KopiaRepositoryStorageSFTPSpec defines SFTP storage options
                  for Kopia repository
