              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: KopiaBackupSpec defines the desired state of KopiaBackup
            properties:
              pvcName:
                description: Name of the PVC to backup
                type: string
              repository:
                description: KopiaRepository to use for the backup
                type: string
              schedule:
                description: Schedule for the backup
                type: string
              suspend:
                description: 'Optional: suspend (default=false) will suspend the cronjob'
                type: boolean
              userCredentialsSecret:
                description: |-
                  Server user credentials secret name (auto-generated, read-only)
                  This field is populated by the operator when server mode is enabled
                  Contains username and password for authenticating to the Kopia Server
                type: string
            required:
            - pvcName
            - repository
            - schedule
            type: object
          status:
            description: KopiaBackupStatus defines the observed state of KopiaBackup
            properties:
              active:
                type: boolean
              backupHistory:
                description: History of the last 10 backup executions
                items:
                  description: BackupHistoryEntry represents a single backup execution
                    record
                  properties:
                    completionTime:
                      description: Timestamp of when the backup completed (nil if
                        still running)
                      format: date-time
                      type: string
                    jobName:
                      description: Name of the Job that executed this backup
                      type: string
                    message:
                      description: Message providing additional details about the
                        backup status
                      type: string
                    startTime:
                      description: Timestamp of when the backup was started
                      format: date-time
                      type: string
                    status:
                      description: Status of the backup (Successful, Failed, InProgress)
                      enum:
                      - Successful
                      - Failed
                      - Pending
                      - InProgress
                      type: string
                  required:
                  - startTime
                  - status
                  type: object
                type: array
              conditions:
                description: Conditions represent the latest available observations
                  of the backup's state
                items:
                  description: "Condition contains details for one aspect of the current
                    state of this API Resource.\n---\nThis struct is intended for
                    direct use as an array at the field path .status.conditions.  For
