                  cacheDirectory:
                    default: cache
                    type: string
                  contentCacheSizeLimitBytes:
                    format: int64
                    type: integer
                  maxCacheSize:
                    default: 5242880000
                    format: int64
                    type: integer
                  maxListCacheDuration:
                    default: 30
                    format: int64
                    type: integer
                  maxMetadataCacheSize:
                    default: 5242880000
                    format: int64
                    type: integer
                  metadataCacheSizeLimitBytes:
                    format: int64
                    type: integer
                  minContentSweepAge:
                    format: int64
                    type: integer
                  minIndexSweepAge:
                    format: int64
                    type: integer
                  minMetadataSweepAge:
                    format: int64
                    type: integer
                type: object
              defaultSchedule:
                description: |-
                  Cronjob for default schedule if not set in KopiaBackup
                  TODO: validate cron format
                type: string
              description:
                default: Cluster
                description: Human-readable description of the repository to use in
                  the UI.
                type: string
              enableActions:
                description: Enables Kopia actions in the repository.
                type: boolean
              fileSystemOptions:
