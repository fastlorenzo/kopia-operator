                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              connected:
                description: Whether the backup is connected to the server
                type: boolean
              fromAnnotation:
                type: boolean
              lastBackupStatus:
                description: Status of the last backup (Successful, Failed, Pending,
                  InProgress)
                enum:
                - Successful
                - Failed
                - Pending
                - InProgress
                type: string
              lastBackupTime:
                description: Timestamp of the last backup attempt (regardless of success
                  or failure)
                format: date-time
                type: string
              lastSuccessfulBackupTime:
                description: Timestamp of the last successful backup
                format: date-time
                type: string
              serverURL:
                description: Server connection status (when server mode is enabled)
                type: string
              username:
                description: Username used for server authentication
                type: string
            required:
            - active
            - fromAnnotation
            type: object
