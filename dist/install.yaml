apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: kopia-operator
    control-plane: controller-manager
  name: kopia-operator-controller-manager-metrics-service
  namespace: kopia-operator
spec:
  ports:
