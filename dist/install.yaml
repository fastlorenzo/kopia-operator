                  dirMode:
                    description: DirectoryMode in the repository.
                    format: int32
                    type: integer
                  fileMode:
                    description: FileMode in the repository.
                    format: int32
                    type: integer
                  gid:
                    description: Group ID of the files in the repository.
                    type: integer
                  nfsPath:
                    description: Export path on the NFS server for the repository.
