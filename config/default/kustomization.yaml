# Adds namespace to all resources.
namespace: kopia-operator

# Value of this field is prepended to the names of all resources.
namePrefix: kopia-operator-

resources:
  - ../crd
  - ../rbac
  - ../manager
  # Uncomment to enable Prometheus monitoring
  # - ../prometheus

patches:
  # Protect the /metrics endpoint by putting it behind auth.
  # Comment the following line to expose /metrics without authentication.
  - path: manager_auth_proxy_patch.yaml
