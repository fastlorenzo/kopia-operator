metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.17.2
  name: kopiabackups.backup.cloudinfra.be
spec:
  group: backup.cloudinfra.be
  names:
    kind: KopiaBackup
    listKind: KopiaBackupList
    plural: kopiabackups
    shortNames:
    - kb
    singular: kopiabackup
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.pvcName
      name: PVC
      type: string
    - jsonPath: .spec.schedule
      name: Schedule
      type: string
    - jsonPath: .spec.repository
      name: Repository
      type: string
    - jsonPath: .spec.suspend
      name: Suspended
      type: boolean
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: KopiaBackup is the Schema for the kopiabackups API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: KopiaBackupSpec defines the desired state of KopiaBackup.
            properties:
              activeDeadlineSeconds:
                default: 21600
                description: |-
                  ActiveDeadlineSeconds is the maximum duration, in seconds, a backup Job may
                  run before it is terminated and marked failed. This guards against a pod
                  that gets stuck (e.g. never leaves Init) blocking all future runs under the
                  Forbid concurrency policy. Defaults to 21600 (6h).
                format: int64
                minimum: 1
                type: integer
              backoffLimit:
                default: 3
                description: |-
                  BackoffLimit is the number of retries before a backup Job is marked failed.
                  Defaults to 3.
                format: int32
                minimum: 0
                type: integer
              failedJobsHistoryLimit:
                default: 1
                description: |-
                  FailedJobsHistoryLimit is the number of failed finished jobs to retain.
                  Defaults to 1, matching the Kubernetes CronJob default.
                format: int32
                minimum: 0
                type: integer
              pvcName:
                description: Name of the PVC to back up.
                minLength: 1
                type: string
              repository:
                description: Name of the KopiaRepository to use for this backup.
                minLength: 1
                type: string
              schedule:
                description: Cron schedule for the backup (e.g. "0 3 * * *").
                minLength: 1
                type: string
              successfulJobsHistoryLimit:
                default: 3
                description: |-
                  SuccessfulJobsHistoryLimit is the number of successful finished jobs to retain.
                  Defaults to 3, matching the Kubernetes CronJob default.
                format: int32
                minimum: 0
                type: integer
              suspend:
                default: false
                description: Suspend the CronJob when set to true.
                type: boolean
              ttlSecondsAfterFinished:
                default: 86400
                description: |-
                  TTLSecondsAfterFinished is the time-to-live, in seconds, for a finished
                  (completed or failed) backup Job before it is automatically deleted. This
                  keeps finished Jobs from accumulating indefinitely. Defaults to 86400 (24h).
                format: int32
                minimum: 0
                type: integer
              userCredentialsSecret:
                description: |-
                  Server user credentials secret name (auto-populated by the operator in server mode).
                  Contains username and password for authenticating to the Kopia Server.
                type: string
            required:
            - pvcName
            - repository
            - schedule
            type: object
          status:
            description: KopiaBackupStatus defines the observed state of KopiaBackup.
            properties:
              autoCreated:
                description: Whether this KopiaBackup was auto-created from a PVC
                  label.
                type: boolean
              backupHistory:
                description: History of the last 10 backup executions.
                items:
                  description: BackupHistoryEntry represents a single backup execution
                    record.
                  properties:
                    completionTime:
                      description: Timestamp of when the backup completed (nil if
                        still running).
                      format: date-time
                      type: string
                    jobName:
                      description: Name of the Job that executed this backup.
                      type: string
                    message:
                      description: Additional details about the backup status.
                      type: string
                    startTime:
                      description: Timestamp of when the backup was started.
                      format: date-time
                      type: string
                    status:
                      description: Status of the backup.
                      enum:
