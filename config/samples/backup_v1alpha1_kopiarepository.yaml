apiVersion: backup.cloudinfra.be/v1alpha1
kind: KopiaRepository
metadata:
  labels:
    app.kubernetes.io/name: kopia-operator
    app.kubernetes.io/managed-by: kustomize
  name: kopiarepository-sample
spec:
  hostname: cluster
  username: kopia
  storageType: filesystem
  passwordSecretName: kopia-repository-password
  fileSystemOptions:
    path: /backup/kopia
    nfsServer: "10.0.0.1"
    nfsPath: /export/backup
