apiVersion: backup.cloudinfra.be/v1alpha1
kind: KopiaRepository
metadata:
  labels:
    app.kubernetes.io/name: kopia-operator
    app.kubernetes.io/managed-by: kustomize
  name: kopiasftprepository-sample
spec:
  hostname: cluster
  username: kopia
  storageType: sftp
  passwordSecretName: kopia-sftp-password
  sftpOptions:
    configMapName: kopia-sftp-config
