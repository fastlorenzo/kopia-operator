apiVersion: backup.cloudinfra.be/v1alpha1
kind: KopiaBackup
metadata:
  labels:
    app.kubernetes.io/name: kopia-operator
    app.kubernetes.io/managed-by: kustomize
  name: kopiabackup-sample
spec:
  # Reference to the KopiaRepository where backups will be stored
  repositoryName: kopiarepository-sample

  # PVC to backup
  pvcName: my-app-data

  # Backup schedule (cron format) - runs daily at 3 AM
  schedule: "0 3 * * *"

  # Set to true to suspend scheduled backups
  suspend: false
