apiVersion: operators.coreos.com/v1alpha1
kind: ClusterServiceVersion
metadata:
  annotations:
    alm-examples: |-
      [
        {
          "apiVersion": "backup.cloudinfra.be/v1alpha1",
          "kind": "KopiaBackup",
          "metadata": {
            "labels": {
              "app.kubernetes.io/managed-by": "kustomize",
              "app.kubernetes.io/name": "kopia-operator"
            },
            "name": "kopiabackup-sample"
          },
          "spec": {
            "pvcName": "my-app-data",
            "repositoryName": "kopiarepository-sample",
            "schedule": "0 3 * * *",
            "suspend": false
          }
        },
        {
          "apiVersion": "backup.cloudinfra.be/v1alpha1",
          "kind": "KopiaRepository",
          "metadata": {
            "labels": {
              "app.kubernetes.io/managed-by": "kustomize",
              "app.kubernetes.io/name": "kopia-operator"
            },
            "name": "kopiasftprepository-sample",
            "namespace": "default"
          },
          "spec": {
            "defaultSchedule": "0 2 * * *",
            "hostname": "cluster",
            "passwordSecretName": "kopia-repository-password",
            "sftpOptions": {
              "credentialsSecret": "kopia-sftp-credentials",
              "host": "sftp.example.com",
              "path": "/backups/kopia-repo",
              "port": 22
            },
            "storageType": "sftp",
            "username": "kopia"
          }
        },
        {
          "apiVersion": "backup.cloudinfra.be/v1alpha1",
          "kind": "KopiaRepository",
          "metadata": {
            "labels": {
              "app.kubernetes.io/managed-by": "kustomize",
              "app.kubernetes.io/name": "kopia-operator"
            },
            "name": "kopiarepository-sample"
          },
          "spec": {
            "defaultSchedule": "0 2 * * *",
            "fileSystemOptions": {
              "nfsPath": "/export/backup",
              "nfsServer": "10.0.0.1",
              "path": "/backup/kopia"
            },
            "hostname": "cluster",
            "passwordSecretName": "kopia-repository-password",
            "storageType": "filesystem",
            "username": "kopia"
          }
        }
      ]
